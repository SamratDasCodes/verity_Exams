<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam Portal</title>
    <!-- Include Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to match the design */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
        
        .header-bg {
            background-color: #0056D2; /* Generation brand blue */
        }
        
        .nav-back-bg {
            background-color: #0045A8; /* Darker blue for back button area */
        }
        
        /* Custom radio button styling */
        .custom-radio {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #9ca3af;
            border-radius: 50%;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .custom-radio::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #0056D2;
        }

        .custom-radio:checked::before {
            transform: scale(1);
        }
        
        .custom-radio:checked {
            border-color: #0056D2;
        }

        .option-container.selected {
            border-color: #0056D2;
            background-color: #f0f7ff;
        }
        
        /* Progress pie chart styling */
        .progress-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: conic-gradient(#d9534f 75%, #f3f4f6 0);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-circle::before {
            content: "";
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: white;
        }

        /* Slide-over menu transition */
        #question-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }
        #question-menu.open {
            transform: translateX(0);
        }
        
        /* Overlay for menu */
        #menu-overlay {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        #menu-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="antialiased text-gray-800 min-h-screen flex flex-col">

    <header class="header-bg text-white shadow-md relative z-20">
        <div class="px-4 py-3 flex items-center justify-between">
            <!-- Hamburger Menu Button -->
            <button id="menu-btn" class="p-1 focus:outline-none focus:ring-2 focus:ring-white rounded">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            
            <!-- Logo area -->
            <div class="text-2xl font-bold italic tracking-wide font-serif">
                Generation
            </div>
            
            <!-- Dark mode toggle placeholder -->
            <button class="p-1 focus:outline-none">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="nav-back-bg text-white px-4 py-3 flex items-center text-sm font-medium z-10 relative shadow-inner">
        <button class="flex items-center hover:text-gray-200 transition-colors focus:outline-none">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to your Dashboard
        </button>
    </div>

    <main class="flex-grow p-4 md:px-8 max-w-3xl mx-auto w-full flex flex-col relative z-0">
        
        <!-- Info Bar (Timer and Grid view) -->
        <div class="bg-white rounded-lg shadow-sm p-3 mb-4 flex justify-between items-center border border-gray-100">
            <div class="flex items-center space-x-3 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
                <div class="progress-circle" title="75% time remaining"></div>
                <span class="text-gray-700 font-medium text-sm">Time Left: 00:19:03</span>
            </div>
            <button class="text-red-600 p-2 hover:bg-red-50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-red-200" title="Question Grid">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Question Card -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden flex-grow flex flex-col border border-gray-200">
            
            <!-- Question Header -->
            <div class="bg-gray-50 px-5 py-4 border-b border-gray-100 flex justify-between items-start">
                <div>
                    <h2 class="text-xl font-bold text-gray-800" id="current-question-label">Question 1 of 20</h2>
                    <button class="text-gray-500 text-sm mt-1 flex items-center hover:text-gray-700 focus:outline-none">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg>
                        Mark for Review
                    </button>
                </div>
                <div class="text-gray-400 flex flex-col items-center cursor-pointer hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                    </svg>
                    <span class="text-xs mt-1 text-center leading-tight hidden sm:block">Mark for<br>Review</span>
                </div>
            </div>

            <!-- Question Content -->
            <div class="p-5 flex-grow">
                <p class="text-gray-800 text-lg mb-6 leading-relaxed" id="question-text">
                    If PETAL: FLOWER; Please find the correct relation.
                </p>

                <!-- Options -->
                <div class="space-y-3" id="options-container">
                    <!-- Option A -->
                    <label class="option-container flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="answer" value="A" class="custom-radio mr-4 focus:ring-0">
                        <span class="text-gray-700 text-base"><strong class="mr-2">A.</strong> Pen: Paper</span>
                    </label>

                    <!-- Option B -->
                    <label class="option-container flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="answer" value="B" class="custom-radio mr-4 focus:ring-0">
                        <span class="text-gray-700 text-base"><strong class="mr-2">B.</strong> Ball: Game</span>
                    </label>

                    <!-- Option C -->
                    <label class="option-container flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="answer" value="C" class="custom-radio mr-4 focus:ring-0">
                        <span class="text-gray-700 text-base"><strong class="mr-2">C.</strong> Engine: Car</span>
                    </label>

                    <!-- Option D -->
                    <label class="option-container flex items-center p-4 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="answer" value="D" class="custom-radio mr-4 focus:ring-0">
                        <span class="text-gray-700 text-base"><strong class="mr-2">D.</strong> Cat: Dog</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mt-4 flex justify-between items-center w-full">
            <button id="prev-btn" class="bg-gray-100 text-gray-500 border border-gray-300 px-4 py-3 rounded-lg font-medium text-sm sm:text-base hover:bg-gray-200 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                Previous Question
            </button>
            <button id="next-btn" class="bg-red-600 text-white px-6 py-3 rounded-lg font-medium text-sm sm:text-base hover:bg-red-700 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 flex items-center shadow-sm">
                Next 
                <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </main>

    <!-- Overlay -->
    <div id="menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30"></div>
    
    <!-- Menu Drawer -->
    <div id="question-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-40 flex flex-col h-full">
        <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
            <h3 class="font-bold text-gray-800 text-lg">Questions</h3>
            <button id="close-menu-btn" class="text-gray-500 hover:text-gray-800 focus:outline-none p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div class="p-4 flex-grow overflow-y-auto">
            <div class="grid grid-cols-4 gap-3" id="question-grid">
                <!-- Grid items generated by JS -->
            </div>
            
            <div class="mt-8 border-t pt-4">
                <h4 class="text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wide">Legend</h4>
                <div class="space-y-2 text-sm">
                    <div class="flex items-center"><div class="w-4 h-4 bg-blue-600 rounded-full mr-2"></div> Current</div>
                    <div class="flex items-center"><div class="w-4 h-4 bg-green-500 rounded-full mr-2"></div> Answered</div>
                    <div class="flex items-center"><div class="w-4 h-4 bg-gray-200 border border-gray-300 rounded-full mr-2"></div> Unanswered</div>
                    <div class="flex items-center"><div class="w-4 h-4 bg-yellow-400 rounded-full mr-2"></div> Marked for Review</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
